<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Guest Check-in Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#111827;color:#fff;margin:0;padding:18px}.wrap{max-width:660px;margin:auto}h1{font-size:clamp(1.7rem,6vw,2.4rem)}.panel{background:#1f2937;padding:18px;border-radius:14px;margin:12px 0}label{display:block;margin-top:10px;font-weight:650}input{width:100%;padding:13px;margin:6px 0 8px;border:1px solid #64748b;border-radius:9px;font-size:16px}button{padding:13px 18px;border:0;border-radius:9px;background:#22c55e;color:#06210f;font-size:16px;font-weight:750;cursor:pointer;margin:8px 6px 4px 0}button.stop{background:#f59e0b;color:#211300}button:disabled{opacity:.55}#reader{background:#fff;border-radius:14px;overflow:hidden;margin-top:14px}.result{padding:18px;border-radius:12px;margin-top:12px;font-size:1.15rem;font-weight:750}.ok{background:#166534}.bad{background:#991b1b}.info{background:#1d4ed8}.help{color:#cbd5e1;font-size:.9rem;line-height:1.45}.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#64748b;margin-right:7px}.ready .status-dot{background:#22c55e}
  </style>
</head>
<body>
<main class="wrap">
  <h1>Guest Check-in Scanner</h1>
  <section class="panel">
    <label for="webAppUrl">Apps Script Web App URL</label>
    <input id="webAppUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="operator">Operator name</label>
    <input id="operator" type="text" placeholder="Example: Desk 1 - Sarah">
    <label for="key">Scanner key</label>
    <input id="key" type="password" autocomplete="off" placeholder="SCANNER_KEY value">
    <button id="startButton" onclick="startScanner()">Start live camera</button>
    <button id="stopButton" class="stop" onclick="stopScanner()" disabled>Stop camera</button>
    <p class="help">The Web App URL and operator name are saved on this device. The scanner key is kept only until this browser tab is closed.</p>
    <div id="connection"><span class="status-dot"></span><span>Not started</span></div>
  </section>
  <div id="reader"></div>
  <div id="result"></div>
</main>

<script>
let scanner = null;
let busy = false;
let lastValue = '';
let lastScanAt = 0;

const urlInput = document.getElementById('webAppUrl');
const operatorInput = document.getElementById('operator');
const keyInput = document.getElementById('key');
urlInput.value = localStorage.getItem('checkinWebAppUrl') || '';
operatorInput.value = localStorage.getItem('checkinOperator') || '';
keyInput.value = sessionStorage.getItem('checkinScannerKey') || '';

function validateConfiguration() {
  const url = urlInput.value.trim().replace(/\?.*$/, '').replace(/\/$/, '');
  const operator = operatorInput.value.trim();
  const key = keyInput.value.trim();
  const validGoogleUrl = /^https:\/\/script\.google\.com\/(?:macros\/s|a\/macros\/[^/]+\/s)\/[^/]+\/exec$/.test(url);
  if (!validGoogleUrl) {
    show(false, 'Enter the Apps Script deployment URL ending in /exec.'); return null;
  }
  if (!operator) { show(false, 'Enter the operator name.'); return null; }
  if (!key) { show(false, 'Enter the scanner key.'); return null; }
  urlInput.value = url;
  localStorage.setItem('checkinWebAppUrl', url);
  localStorage.setItem('checkinOperator', operator);
  sessionStorage.setItem('checkinScannerKey', key);
  return { url, operator, key };
}

function startScanner() {
  if (scanner) return;
  if (!validateConfiguration()) return;
  scanner = new Html5Qrcode('reader');
  setConnection('Starting camera...', false);
  scanner.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: function(w,h){const size=Math.floor(Math.min(w,h)*0.72);return{width:size,height:size}}, aspectRatio: 1 },
    onDecoded,
    function() {}
  ).then(function() {
    document.getElementById('startButton').disabled = true;
    document.getElementById('stopButton').disabled = false;
    setConnection('Camera ready', true);
    showInfo('Point the camera at a participant QR code.');
  }).catch(function(error) {
    scanner = null;
    setConnection('Camera unavailable', false);
    show(false, 'Camera error: ' + error);
  });
}

function stopScanner() {
  if (!scanner) return;
  scanner.stop().then(function() {
    scanner.clear(); scanner = null;
    document.getElementById('startButton').disabled = false;
    document.getElementById('stopButton').disabled = true;
    setConnection('Stopped', false);
  });
}

function onDecoded(value) {
  const now = Date.now();
  if (busy || (value === lastValue && now - lastScanAt < 6000)) return;
  const config = validateConfiguration();
  if (!config) return;
  busy = true; lastValue = value; lastScanAt = now;
  showInfo('QR detected. Checking participant...');
  callCheckinApi(config, value)
    .then(function(result) {
      const identity = [result.jobTitle, result.institution].filter(Boolean).join(' - ');
      const prefix = result.name ? result.name + (identity ? ' (' + identity + ')' : '') + ' - ' : '';
      show(result.ok, prefix + result.message + (result.quota ? ' Quota: ' + result.quota : ''));
    })
    .catch(function(error) { show(false, 'Connection error: ' + error.message); })
    .finally(function() { setTimeout(function(){busy=false}, 1300); });
}

function callCheckinApi(config, value) {
  return new Promise(function(resolve, reject) {
    const callback = '__checkin_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    const timeout = setTimeout(function(){cleanup();reject(new Error('Request timed out.'))},15000);
    function cleanup(){clearTimeout(timeout);delete window[callback];script.remove()}
    window[callback] = function(result){cleanup();resolve(result)};
    script.onerror = function(){cleanup();reject(new Error('Apps Script endpoint could not be reached.'))};
    script.src = config.url + '?action=checkin'
      + '&callback=' + encodeURIComponent(callback)
      + '&value=' + encodeURIComponent(value)
      + '&key=' + encodeURIComponent(config.key)
      + '&operator=' + encodeURIComponent(config.operator)
      + '&_=' + Date.now();
    document.head.appendChild(script);
  });
}

function setConnection(text, ready){const e=document.getElementById('connection');e.className=ready?'ready':'';e.querySelector('span:last-child').textContent=text}
function show(ok,text){const e=document.getElementById('result');e.className='result '+(ok?'ok':'bad');e.textContent=text;if(navigator.vibrate)navigator.vibrate(ok?150:[100,80,100])}
function showInfo(text){const e=document.getElementById('result');e.className='result info';e.textContent=text}
</script>
</body>
</html>
